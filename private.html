<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cousins Only · Craft Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="site-gate" class="site-gate">
    <div class="hero" style="max-width: 340px;">
      <h1>Craft Co. 🔒</h1>
      <p>Enter the password to get in.</p>
      <form id="site-gate-form" style="max-width: 260px; margin: 0 auto; box-shadow: none; padding: 0; background: none;">
        <input type="password" id="site-gate-input" placeholder="Password" required />
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Enter</button>
        <p id="site-gate-error" class="hidden form-error"></p>
      </form>
    </div>
  </div>


  <header class="site-header">
    <div class="nav-inner">
      <a class="site-title" href="index.html">Craft Co.</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="limited.html">Limited Edition</a>
        <a href="members.html">Rewards</a>
        <a href="member.html">Member</a>
        <a href="private.html">Cousins Only</a>
        <a href="order.html">Cart <span class="cart-badge cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section id="passcode-gate" class="hero">
      <h1>Cousins Only 🔒</h1>
      <p>Enter the passcode to get in.</p>
      <form id="passcode-form" style="max-width: 280px; margin: 0 auto; box-shadow: none; padding: 0; background: none;">
        <input type="password" id="passcode-input" placeholder="Passcode" required />
        <button type="submit" class="btn btn-secondary" style="margin-top: 1rem; width: 100%;">Enter</button>
        <p id="passcode-error" class="hidden form-error"></p>
      </form>
    </section>

    <section id="whoami-gate" class="hero hidden">
      <h1>Who Are You?</h1>
      <p>So we know whose message is whose.</p>
      <div style="display: flex; gap: 1rem; justify-content: center;">
        <button class="btn btn-secondary whoami-btn" data-name="Addy">I'm Addy</button>
        <button class="btn btn-secondary whoami-btn" data-name="Cousin">I'm Cousin</button>
      </div>
    </section>

    <section id="chat-section" class="hero hidden">
      <h1>Text Thread 💬</h1>
      <p id="chat-whoami-label" style="color: var(--text-light);"></p>

      <div id="call-bar" class="call-bar hidden"></div>
      <p id="call-debug" style="font-size: 0.75rem; color: var(--text-light); text-align: center; margin-top: -0.5rem;"></p>

      <button id="start-call-btn" class="btn btn-secondary btn-small">📞 Audio Call</button>

      <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 0.5rem;">Tap a message to ❤️ it.</p>

      <div id="chat-thread" class="chat-thread"></div>

      <div class="emoji-row">
        <button type="button" class="emoji-btn">😂</button>
        <button type="button" class="emoji-btn">❤️</button>
        <button type="button" class="emoji-btn">😭</button>
        <button type="button" class="emoji-btn">🔥</button>
        <button type="button" class="emoji-btn">👍</button>
        <button type="button" class="emoji-btn">😱</button>
        <button type="button" class="emoji-btn">🎉</button>
        <button type="button" class="emoji-btn">✨</button>
      </div>

      <form id="chat-form" class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Text message..." autocomplete="off" required />
        <button type="submit" class="btn btn-primary btn-small">Send</button>
      </form>

      <button id="toggle-poll-btn" type="button" class="btn btn-secondary btn-small" style="margin-top: 0.75rem;">📊 Send a Poll</button>

      <form id="poll-form" class="poll-form hidden">
        <input type="text" id="poll-question" placeholder="Ask a question..." required />
        <input type="text" id="poll-option-a" placeholder="Option A" required />
        <input type="text" id="poll-option-b" placeholder="Option B" required />
        <button type="submit" class="btn btn-primary btn-small">Send Poll</button>
      </form>

      <video id="remote-video" class="hidden" autoplay playsinline></video>
      <audio id="remote-audio" autoplay></audio>
    </section>
  </main>

  <footer class="site-footer">
    <p>Craft Co. &middot; Handmade by two cousins</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>
