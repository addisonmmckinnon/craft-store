<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members · Craft Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="site-gate" class="site-gate">
    <div class="hero" style="max-width: 340px;">
      <h1>Craft Co. 🔒</h1>
      <p>Enter the password to get in.</p>
      <form id="site-gate-form" style="max-width: 260px; margin: 0 auto; box-shadow: none; padding: 0; background: none;">
        <input type="password" id="site-gate-input" placeholder="Password" required />
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Enter</button>
        <p id="site-gate-error" class="hidden form-error"></p>
      </form>
    </div>
  </div>


  <header class="site-header">
    <div class="nav-inner">
      <a class="site-title" href="index.html">Craft Co.</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="limited.html">Limited Edition</a>
        <a href="members.html">Rewards</a>
        <a href="member.html">Member</a>
        <a href="private.html">Cousins Only</a>
        <a href="order.html">Cart <span class="cart-badge cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Craft Co. Rewards</h1>
      <p>Earn 1 point for every $1 you spend. 25 points = $2 off a future order!</p>

      <div class="crafter-card" style="max-width: 320px; margin: 0 auto;">
        <h3>Your Points</h3>
        <p style="font-family: 'Baloo 2', cursive; font-size: 2.5rem; color: var(--coral); margin: 0;">
          <span class="points-count">0</span>
        </p>
        <button id="redeem-btn" class="btn btn-primary btn-small" style="margin-top: 1rem;">Redeem 25 Points for $2 Off</button>
        <p id="redeem-message" style="font-weight: 700; margin-top: 0.75rem; min-height: 1.2rem;"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Craft Co. &middot; Handmade by two cousins</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
